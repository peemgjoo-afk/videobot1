name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y openjdk-17-jdk python3-pip git zip unzip libffi-dev libssl-dev
          pip3 install --upgrade pip
          pip3 install buildozer Cython
      - name: Accept licenses
        run: |
          mkdir -p ~/.android/licenses
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" > ~/.android/licenses/android-sdk-license
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> ~/.android/licenses/android-sdk-license
      - name: Build APK
        run: |
          rm -rf .buildozer bin
          yes | buildozer android debug || true
          SDKMANAGER=$(find ~/.buildozer -name sdkmanager | head -n1)
          yes | $SDKMANAGER --licenses || true
          buildozer android debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: bin/*.apk
