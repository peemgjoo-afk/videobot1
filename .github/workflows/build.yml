name: Build APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install buildozer==1.5.0
          pip install Cython==0.29.33

      - name: Build APK
        run: |
          export SDK_ROOT=$HOME/.buildozer/android/platform/android-sdk
          rm -rf $SDK_ROOT
          mkdir -p $SDK_ROOT/cmdline-tools
          mkdir -p $SDK_ROOT/licenses
          mkdir -p $SDK_ROOT/tools/bin
          cd /tmp
          rm -rf cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip
          mkdir -p $SDK_ROOT/cmdline-tools/latest
          mv cmdline-tools/* $SDK_ROOT/cmdline-tools/latest/ 2>/dev/null || true
          mv cmdline-tools/cmdline-tools/* $SDK_ROOT/cmdline-tools/latest/ 2>/dev/null || true
          # FIX: Buildozer calls old path tools/bin/sdkmanager which fails with Java 17
          # Make it a wrapper that calls new sdkmanager
          cat > $SDK_ROOT/tools/bin/sdkmanager << 'EOF'
          #!/bin/bash
          exec $HOME/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager "$@"
          EOF
          chmod +x $SDK_ROOT/tools/bin/sdkmanager
          cat > $SDK_ROOT/tools/bin/avdmanager << 'EOF'
          #!/bin/bash
          exec $HOME/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/avdmanager "$@"
          EOF
          chmod +x $SDK_ROOT/tools/bin/avdmanager
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" > $SDK_ROOT/licenses/android-sdk-license
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> $SDK_ROOT/licenses/android-sdk-license
          echo "24333f8a63b6825ea9c5514f83c1059b8ea731b" > $SDK_ROOT/licenses/android-sdk-preview-license
          export PATH=$SDK_ROOT/cmdline-tools/latest/bin:$SDK_ROOT/tools/bin:$PATH
          export ANDROID_SDK_ROOT=$SDK_ROOT
          export ANDROID_HOME=$SDK_ROOT
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2" || true
          unset ANDROID_HOME
          unset ANDROID_SDK_ROOT
          unset ANDROID_NDK_HOME
          unset ANDROID_NDK_ROOT
          cd $GITHUB_WORKSPACE
          rm -rf .buildozer bin
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: bin/*.apk
