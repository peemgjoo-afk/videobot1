name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Nuke Python 3.13/3.14
        run: |
          sudo rm -rf /opt/hostedtoolcache/Python/3.14* /opt/hostedtoolcache/Python/3.13* || true
          python3 --version
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install buildozer==1.5.0 Cython==3.0.11
      - name: Build APK
        run: |
          rm -rf.buildozer bin __pycache__
          SDK_ROOT=$HOME/.buildozer/android/platform/android-sdk
          mkdir -p $SDK_ROOT/cmdline-tools $SDK_ROOT/tools/bin $SDK_ROOT/licenses
          cd /tmp
          rm -rf cmdline-tools.zip cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip
          mkdir -p $SDK_ROOT/cmdline-tools/latest
          mv cmdline-tools/* $SDK_ROOT/cmdline-tools/latest/ || true
          echo '#!/bin/bash' > $SDK_ROOT/tools/bin/sdkmanager
          echo 'exec $HOME/.[STRIPPED 74 bytes] "$@"' >> $SDK_ROOT/tools/bin/sdkmanager
          chmod +x $SDK_ROOT/tools/bin/sdkmanager
          echo '#!/bin/bash' > $SDK_ROOT/tools/bin/avdmanager
          echo 'exec $HOME/.[STRIPPED 74 bytes] "$@"' >> $SDK_ROOT/tools/bin/avdmanager
          chmod +x $SDK_ROOT/tools/bin/avdmanager
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" > $SDK_ROOT/licenses/android-sdk-license
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> $SDK_ROOT/licenses/android-sdk-license
          echo "24333f8a63b6825ea9c5514f83c1059b8ea731b" > $SDK_ROOT/licenses/android-sdk-preview-license
          export PATH=$SDK_ROOT/cmdline-tools/latest/bin:$SDK_ROOT/tools/bin:$PATH
          export ANDROID_SDK_ROOT=$SDK_ROOT
          export ANDROID_HOME=$SDK_ROOT
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2" "ndk;25.1.8937393" || true
          cd $GITHUB_WORKSPACE
          rm -rf .buildozer bin
          python3 -m buildozer -v android debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: bin/*.apk
