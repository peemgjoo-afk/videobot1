name: Build APK
on: [push]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Fix Python 3.14 cgi removal - force python3 to 3.10
        run: |
          sudo update-alternatives --install /usr/bin/python3 python3 /usr/bin/python3.10 10 || true
          sudo update-alternatives --set python3 /usr/bin/python3.10 || true
          python3 --version
          pip3 install --upgrade pip
          pip3 install legacy-cgi || true
          python3 -c "import cgi; print('cgi ok')" || echo "cgi missing, will use wrapper"

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install buildozer==1.5.0
          pip install Cython==0.29.33
          pip install legacy-cgi

      - name: Build APK
        run: |
          export SDK_ROOT=$HOME/.buildozer/android/platform/android-sdk
          rm -rf $SDK_ROOT
          mkdir -p $SDK_ROOT/cmdline-tools
          mkdir -p $SDK_ROOT/licenses
          mkdir -p $SDK_ROOT/tools/bin
          cd /tmp
          rm -rf cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip
          mkdir -p $SDK_ROOT/cmdline-tools/latest
          mv cmdline-tools/* $SDK_ROOT/cmdline-tools/latest/ 2>/dev/null || true
          mv cmdline-tools/cmdline-tools/* $SDK_ROOT/cmdline-tools/latest/ 2>/dev/null || true
          cat > $SDK_ROOT/tools/bin/sdkmanager << 'EOF'
          #!/bin/bash
          exec $HOME/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager "$@"
          EOF
          chmod +x $SDK_ROOT/tools/bin/sdkmanager
          cat > $SDK_ROOT/tools/bin/avdmanager << 'EOF'
          #!/bin/bash
          exec $HOME/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/avdmanager "$@"
          EOF
          chmod +x $SDK_ROOT/tools/bin/avdmanager
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" > $SDK_ROOT/licenses/android-sdk-license
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> $SDK_ROOT/licenses/android-sdk-license
          echo "24333f8a63b6825ea9c5514f83c1059b8ea731b" > $SDK_ROOT/licenses/android-sdk-preview-license
          export PATH=$SDK_ROOT/cmdline-tools/latest/bin:$SDK_ROOT/tools/bin:$PATH
          export ANDROID_SDK_ROOT=$SDK_ROOT
          export ANDROID_HOME=$SDK_ROOT
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2" || true
          # patch cgi for Python 3.14 build-envs
          for py in /usr/bin/python3.10 /usr/bin/python3.11 /usr/bin/python3.12 /usr/bin/python3.13 /usr/bin/python3.14 /opt/hostedtoolcache/Python/3.10.21/x64/bin/python; do
            if [ -f "$py" ]; then
              $py -m pip install legacy-cgi Cython==0.29.33 2>/dev/null || true
            fi
          done
          unset ANDROID_HOME
          unset ANDROID_SDK_ROOT
          unset ANDROID_NDK_HOME
          unset ANDROID_NDK_ROOT
          cd $GITHUB_WORKSPACE
          rm -rf .buildozer bin
          python3 -m buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: bin/*.apk
