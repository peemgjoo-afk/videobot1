name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y openjdk-17-jdk python3-pip git zip unzip libffi-dev libssl-dev libltdl-dev libbz2-dev libsqlite3-dev autoconf automake libtool
          pip3 install --upgrade pip
          pip3 install "Cython==3.0.11" buildozer==1.5.0

      - name: Accept licenses
        run: |
          mkdir -p ~/.android/licenses
          echo "8933bad161af4178b1185d1a37fbf41ea5269c55" > ~/.android/licenses/android-sdk-license
          echo "d56f5187479451eabf01fb78af6dfcb131a6481e" >> ~/.android/licenses/android-sdk-license
          echo "24333f8a63b6825ea9c5514f83c1051866b9c4b2" >> ~/.android/licenses/android-sdk-license

      - name: Build APK
        run: |
          rm -rf .buildozer bin __pycache__ ~/.buildozer
          yes | buildozer android debug || true
          SDKMANAGER=$(find ~/.buildozer -name sdkmanager 2>/dev/null | head -n1)
          yes | $SDKMANAGER --licenses || true
          buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: bin/*.apk
