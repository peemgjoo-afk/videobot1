name: Build APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build APK
        run: |
          sudo chmod -R 777.
          docker pull kivy/buildozer:latest
          docker run --rm --user root -v ${{ github.workspace }}:/home/user/hostcwd -e BUILDOZER_ALLOW_ROOT=1 kivy/buildozer bash -c "yes | buildozer android debug"
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: bin/*.apk
